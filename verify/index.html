<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verifying...</title>
</head>
<body>
    <script>
        const ref = document.referrer;
        const allowed = ref.includes('/password') || ref.endsWith('password.html');

        if (!allowed) {
            history.back();
        } else {
            const pwd = sessionStorage.getItem('pwd');
            sessionStorage.removeItem('pwd');

            const CORRECT = 'yourpasswordhere';

            if (pwd === CORRECT) {
                window.location.href = '/quiz';
            } else {
                window.location.href = '/password';
            }
        }
    </script>
</body>
</html>
